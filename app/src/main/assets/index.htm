<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grave Digger RC</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      margin: 0;
      background: #0f1115;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #9ca3af;
      background: #181b22;
      padding: 8px 12px;
      border-radius: 10px;
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex: 1;
      margin: 10px 0;
    }
    .joy-zone {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background: #181b22;
      border: 2px solid #2a2f3a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .joy-stick {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 4px 14px rgba(59,130,246,0.45);
      position: absolute;
      transform: translate(0px, 0px);
    }
    .joy-label {
      margin-top: 6px;
      font-size: 12px;
      color: #9ca3af;
    }
    .aux-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .aux-btn {
      background: #1e232d;
      color: #e5e7eb;
      border: 1px solid #323946;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .aux-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span id="status">UDP -> 192.168.4.1:4210</span>
    <span id="telemetry">T: 0 | S: 0 | B: 0000</span>
  </div>

  <div class="controls-row">
    <div style="display:flex; flex-direction:column; align-items:center;">
      <div class="joy-zone" id="joyThrottle">
        <div class="joy-stick" id="stickThrottle"></div>
      </div>
      <span class="joy-label">VITESSE</span>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center;">
      <div class="joy-zone" id="joySteer">
        <div class="joy-stick" id="stickSteer"></div>
      </div>
      <span class="joy-label">DIRECTION</span>
    </div>
  </div>

  <div class="aux-grid">
    <button class="aux-btn" data-idx="0">B1 / AUX</button>
    <button class="aux-btn" data-idx="1">B2 / VITESSE</button>
    <button class="aux-btn" data-idx="2">B3 / PRESET</button>
    <button class="aux-btn" data-idx="3">B4 / CAPTEUR</button>
  </div>

  <script>
    const SEND_INTERVAL_MS = 25;
    const MAX_RADIUS = 46;

    let throttleVal = 0;
    let steerVal = 0;
    let buttons = [0, 0, 0, 0];

    function sendCommand() {
      const bString = buttons.join("");
      const payload = `T:${throttleVal},S:${steerVal},B:${bString}`;
      document.getElementById("telemetry").textContent = `T: ${throttleVal} | S: ${steerVal} | B: ${bString}`;

      if (window.AndroidBridge && typeof window.AndroidBridge.sendUdp === "function") {
        window.AndroidBridge.sendUdp(payload);
      }
    }

    function setupJoystick(zoneId, stickId, axisMode) {
      const zone = document.getElementById(zoneId);
      const stick = document.getElementById(stickId);
      let activePointerId = null;

      function updateFromEvent(e) {
        const rect = zone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        let dx = e.clientX - cx;
        let dy = e.clientY - cy;

        if (axisMode === "vertical") {
          dx = 0;
          dy = Math.max(-MAX_RADIUS, Math.min(MAX_RADIUS, dy));
          throttleVal = Math.round((-dy / MAX_RADIUS) * 100);
        } else if (axisMode === "horizontal") {
          dy = 0;
          dx = Math.max(-MAX_RADIUS, Math.min(MAX_RADIUS, dx));
          steerVal = Math.round((dx / MAX_RADIUS) * 100);
        }

        stick.style.transform = `translate(${dx}px, ${dy}px)`;
      }

      function resetStick() {
        activePointerId = null;
        stick.style.transform = "translate(0px, 0px)";
        if (axisMode === "vertical") throttleVal = 0;
        if (axisMode === "horizontal") steerVal = 0;
        sendCommand();
      }

      zone.addEventListener("pointerdown", (e) => {
        activePointerId = e.pointerId;
        zone.setPointerCapture(e.pointerId);
        updateFromEvent(e);
      });

      zone.addEventListener("pointermove", (e) => {
        if (e.pointerId === activePointerId) updateFromEvent(e);
      });

      zone.addEventListener("pointerup", (e) => {
        if (e.pointerId === activePointerId) resetStick();
      });

      zone.addEventListener("pointercancel", (e) => {
        if (e.pointerId === activePointerId) resetStick();
      });
    }

    setupJoystick("joyThrottle", "stickThrottle", "vertical");
    setupJoystick("joySteer", "stickSteer", "horizontal");

    document.querySelectorAll(".aux-btn").forEach((btn) => {
      const idx = Number(btn.dataset.idx);

      btn.addEventListener("pointerdown", () => {
        buttons[idx] = 1;
        btn.classList.add("active");
        sendCommand();
      });

      const release = () => {
        buttons[idx] = 0;
        btn.classList.remove("active");
        sendCommand();
      };

      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", () => {
        if (buttons[idx] === 1) release();
      });
    });

    setInterval(sendCommand, SEND_INTERVAL_MS);
  </script>
</body>
</html>
